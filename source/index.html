    <title>تدرُّج - رحلة العلم والعمل</title>
    <link rel="icon" type="image/png" href="/favicon1.png">

    <style>
        :root {
            --accent-primary: #10b981;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #87CEEB; /* Sky Blue Base */
            overflow-x: hidden;
            margin: 0;
        }
        .font-quran { font-family: 'Noto Naskh Arabic', serif; }
        .font-heritage { font-family: 'Amiri', serif; }
        
        /* Cloud Floating Animation */
        @keyframes floatCloud {
            from { transform: translateX(110vw); }
            to { transform: translateX(-20vw); }
        }

        /* Leaf Falling and Swaying Animation */
        .leaf {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
            animation: fall linear infinite, sway ease-in-out infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        @keyframes sway {
            0%, 100% { margin-left: 0px; }
            50% { margin-left: 50px; }
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 10px;
        }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Sky Gradient Background for Light Mode */
        .sky-bg {
            background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 40%, #F0F8FF 100%);
            background-attachment: fixed;
        }

        /* Global Dynamic Color Overrides for specific UI elements */
        .accent-border { border-color: var(--accent-primary); }
        .accent-text { color: var(--accent-primary); }
        .accent-bg { background-color: var(--accent-primary); }
    </style>
